# Blackout + ProPainter at the conditioned arm's own operating point.
#
# tab:wholeframe's between-arm comparison could not report
# blackout+propainter: the arm existed only on bear/camel/dog/india/pigs/
# tennis at x265 QP 32, and the conditioned arm at that operating point runs
# on a disjoint set of videos, so the two shared zero groups. These runs put
# blackout+propainter on twelve videos where downsample+realesrgan already
# exists, at identical block size, budget, protection and codec settings, so
# the arms pair within (video, codec, QP, resolution).

experiments:
