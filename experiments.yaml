# --- Q10: controlled UFO mask dilate / erode / jitter (HOLE(sec:evaluation)) ---
# Wave 2 GPU arm. Same recipe as D6.1 tab:mask-sens (elvis blackout, x265 qp34,
# fg_protect) so cells are comparable to the existing bear/camel gt arms
# (hashes c0cc5f978dc4c99f / 8911d2e29a111443). mask_source stays ufo (default);
# morphology is the orthogonal axis.
#
# Contract (see preprocessing.apply_mask_morphology):
#   mask_morphology: none|dilate|erode|jitter
#   mask_morphology_radius: pixels on the full-res mask (elliptical kernel
#     diameter = 2*r+1 for dilate/erode; max |shift| for jitter)
#   mask_morphology_seed: jitter RNG seed only (seed + frame_index)
#
# Erosion is the failure-mode arm: it shrinks FG so fg_protect covers less of
# the true object (defeats hard FG protection). Dilate is the conservative
# over-protect arm. Jitter is seeded spatial translation noise.
